<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>טופס אורח · מלון הספורטאים</title>
<style>
  :root { --green: #15803d; --ink: #1e293b; --muted: #475569; --line: #cbd5e1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; line-height: 1.5; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; max-width: 480px; margin: 0 auto; padding: 12px 18px 0; }
  .brand { width: 240px; height: auto; }   /* ⬅ 5.11 (אורן): שהכיתוב שבלוגו יהיה קריא בטלפון */
  .keywarn { background: #b91c1c; color: #fff; font-weight: 700; text-align: center; padding: 8px 12px; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 18px 32px; }
  h1 { color: #14532d; font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 14px; }
  label.f { display: block; margin-top: 12px; font-size: 15px; color: #334155; }
  input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number] { width: 100%; margin-top: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; color: var(--ink); background: #fff; }
  input::placeholder { color: #94a3b8; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .notice { margin-top: 16px; padding: 12px 14px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 12px; font-size: 14px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 15px; }
  .consent input { width: 24px; height: 24px; accent-color: var(--green); flex: none; margin: 2px 0 0; }
  .sigwrap { margin-top: 14px; font-size: 15px; color: #334155; }
  canvas#sig { display: block; width: 100%; height: 130px; margin-top: 4px; border: 2px dashed #94a3b8; border-radius: 12px; touch-action: none; background: #fff; }
  button.link { background: none; border: 0; color: #2563eb; font: inherit; font-size: 14px; padding: 6px 0; }
  .why { color: #b45309; font-size: 14px; min-height: 20px; margin-top: 6px; }
  #go { display: block; width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--green); color: #fff; font: inherit; font-size: 18px; font-weight: 700; text-align: center; text-decoration: none; }
  #go[aria-disabled=true] { opacity: .45; pointer-events: none; }
  .ok { padding: 14px; border-radius: 12px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; font-weight: 700; }
  .langbtn { margin-inline-start: 8px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; font-weight: 700; }
  .declare { font-weight: 600; }
</style>
</head>

const t = (k) => FORMS[FORM][lang][k] ?? COMMON[lang][k];
const W = 320, H = 120, PAD = 4;   // רשת החתימה: הוקטורים נשמרים במספרים שלמים, בלי קשר לגודל המסך

const $ = (id) => document.getElementById(id);
function paint() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-only]').forEach((el) => { el.hidden = el.dataset.only !== FORM; el.style.display = el.dataset.only !== FORM ? 'none' : ''; });
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) ?? ''; });
  $('lang').textContent = t('langBtn');
  $('name').placeholder = lang === 'he' ? 'שם' : 'Name';
  $('phone').placeholder = '050-0000000';
}
paint();
$('lang').addEventListener('click', () => { lang = lang === 'he' ? 'en' : 'he'; paint(); refresh(); });

// ── חתימה ──
const canvas = $('sig'), ctx = canvas.getContext('2d');
let strokes = [], current = null;
function fit() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  draw();
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 2.2 * (window.devicePixelRatio || 1); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1e293b';
  const sx = canvas.width / W, sy = canvas.height / H;
  for (const s of strokes) { ctx.beginPath(); s.forEach(([x, y], i) => (i ? ctx.lineTo(x * sx, y * sy) : ctx.moveTo(x * sx, y * sy))); if (s.length === 1) ctx.lineTo(s[0][0] * sx + 0.1, s[0][1] * sy); ctx.stroke(); }
}
// ⛔ בלי הצמדה לריבוע: בבדיקה של אורן קו שיצא מהריבוע נחתך, כי כל נקודה בחוץ נצמדה לקצה. התקרה כאן רק נגד ערכים קיצוניים.
const inRange = (v) => Math.min(1500, Math.max(-1000, v));
const at = (e) => { const r = canvas.getBoundingClientRect(); return [inRange((e.clientX - r.left) / r.width * W), inRange((e.clientY - r.top) / r.height * H)]; };
// ⛔ תקרה בזמן הציור, וציור פעם בפריים: חתימה ארוכה מאוד לא תוקעת את הטלפון
let points = 0, tooLong = false, drawing = false;
const drawSoon = () => { if (drawing) return; drawing = true; requestAnimationFrame(() => { drawing = false; draw(); }); };
const add = (p) => { if (points >= MAX_POINTS) { tooLong = true; return false; } points += 1; current.push(p); return true; };
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); if (points >= MAX_POINTS) { tooLong = true; refresh(); return; } current = []; strokes.push(current); add(at(e)); drawSoon(); });
canvas.addEventListener('pointermove', (e) => { if (!current) return; for (const c of e.getCoalescedEvents?.() || [e]) if (!add(at(c))) break; drawSoon(); });
const end = () => { current = null; refresh(); };
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
$('clear').addEventListener('click', () => { strokes = []; points = 0; tooLong = false; draw(); refresh(); });
window.addEventListener('resize', fit); fit();

// ── קידוד החתימה ──
function simplify(p, eps) {   // Ramer-Douglas-Peucker, בלי רקורסיה: חתימה ארוכה הפילה את המחסנית
  if (p.length < 3) return p;
  const keep = new Uint8Array(p.length), todo = [[0, p.length - 1]];
  keep[0] = 1; keep[p.length - 1] = 1;
  while (todo.length) {
    const [from, to] = todo.pop(), [ax, ay] = p[from], [bx, by] = p[to], dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
    let best = 0, at2 = -1;
    for (let i = from + 1; i < to; i++) { const d = Math.abs(dy * p[i][0] - dx * p[i][1] + bx * ay - by * ax) / len; if (d > best) { best = d; at2 = i; } }
    if (best > eps) { keep[at2] = 1; todo.push([from, at2], [at2, to]); }
  }
  return p.filter((_, i) => keep[i]);
}
/** קו שיצא מהריבוע נשמר במלואו: הרשת גדלה סביבו, כדי שכל מי שמצייר לפי sigW ו-sigH יראה את כולו. */
function framed() {
  const lines = strokes.map((s) => simplify(s, 0.7).map(([x, y]) => [Math.round(x), Math.round(y)]));
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of lines) for (const [x, y] of s) { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
  const ox = Math.max(0, PAD - minX), oy = Math.max(0, PAD - minY);
  return { lines: lines.map((s) => s.map(([x, y]) => [x + ox, y + oy])), w: Math.max(W, maxX + ox + PAD), h: Math.max(H, maxY + oy + PAD) };
}
function sigBytes(lines) {
  const out = [];
  const varint = (n) => { while (n > 127) { out.push((n & 127) | 128); n >>>= 7; } out.push(n); };
  const zig = (n) => varint(n >= 0 ? n * 2 : -n * 2 - 1);
  varint(lines.length);
  for (const pts of lines) {
    varint(pts.length);
    let px = 0, py = 0;
    for (const [x, y] of pts) { zig(x - px); zig(y - py); px = x; py = y; }
  }
  return new Uint8Array(out);
}
const b64u = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const join = (...parts) => { const o = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; };

// ⛔ בלי דחיסה ובלי בתים בינאריים: השרת פותח ב-$security.decrypt, שמחזיר מחרוזת. ראו pocketbase/pb_hooks/guest_form_lib.cjs
async function encrypt(payload) {
  // מפתח AES של 32 תווי ASCII: מתאים ל-$security.decrypt של PocketBase
  const raw = new TextEncoder().encode(b64u(crypto.getRandomValues(new Uint8Array(24))));
  const aes = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const rsa = await crypto.subtle.importKey('jwk', PUBLIC_KEY, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aes, new TextEncoder().encode(JSON.stringify(payload))));
  const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, rsa, raw));
  return PREFIX + b64u(join(new Uint8Array([FORMAT_VERSION]), wrapped, iv, ct));
}

// ── שער ──
// ⚠ אותם כללים כמו בשרת: מה שנדחה בקבלה עדיף שייעצר כאן, כשהאורח עוד מול הטופס
function missing() {
  const phone = $('phone').value.trim(), email = $('email').value.trim();
  if (!window.isSecureContext || !crypto.subtle || !FORM_ID) return t('noHttps');
  if (!$('name').value.trim()) return t('noName');
  if (!phone) return t('noPhone');
  if (!/^[0-9+\-\s()]{7,20}$/.test(phone)) return t('badPhone');
  if (FORM === 'checkin' && email && !/^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/.test(email)) return t('badEmail');
  if (FORM === 'standby') {
    if (!$('from').value || !$('to').value) return t('noDates');
    if ($('from').value > $('to').value) return t('badDates');
    if (new Date($('to').value) - new Date() > 365 * 86400000) return t('farDates');   // השרת דוחה מעל 366 יום
    if (!$('consent').checked) return t('noConsent');   // בצ'ק-אין המשוב רשות, וכבוי כברירת מחדל
  }
  if (!strokes.length) return t('noSig');
  if (tooLong) return t('longSig');
  return '';
}
function payloadOf(sig, frame) {
  const base = { form: FORM, lang, textVersion: TEXT_VERSION, createdAt: new Date().toISOString(), formId: FORM_ID, name: $('name').value.trim(), phone: $('phone').value.trim(), sig: b64u(sig), sigW: frame.w, sigH: frame.h };
  return FORM === 'checkin'
    ? { ...base, email: $('email').value.trim(), feedback: $('feedback').checked, declared: true }
    : { ...base, from: $('from').value, to: $('to').value, people: Math.min(9, Math.max(1, Math.round(Number($('people').value)) || 1)), consent: true };
}
// ⛔ הקישור מוכן לפני הלחיצה: לחיצה ישירה על קישור היא מה שנבדק בטלפון ופותח את האפליקציה. הצפנה אחרי הלחיצה עלולה לאבד אותה.
let turn = 0;
function closed(why) { $('go').removeAttribute('href'); $('go').setAttribute('aria-disabled', 'true'); $('status').hidden = true; $('why').textContent = why; }
async function refresh() {
  const mine = ++turn;
  closed(missing());
  if (missing()) return;
  const frame = framed(), sig = sigBytes(frame.lines);
  if (sig.length > MAX_SIGNATURE_BYTES) { closed(t('longSig')); return; }
  const text = await encrypt(payloadOf(sig, frame));
  if (mine !== turn) return;
  $('go').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  $('go').removeAttribute('aria-disabled');
  $('status').textContent = t('ready'); $('status').hidden = false;
}
for (const id of ['name', 'phone', 'email', 'from', 'to', 'people', 'consent', 'feedback']) $(id).addEventListener('input', refresh);
// ⛔ הטופס לא יודע אם ההודעה נשלחה, ולכן לא כתוב "נשלח"
$('go').addEventListener('click', () => { if ($('go').href) $('status').textContent = t('opened'); });
refresh();
